<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>班級抽獎系統 (極致流暢運鏡版)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

  <style>
    :root {
      --primary: #00e5ff;
      --secondary: #ff00ea;
      --success: #00ff66;
    }

    body {
      background-color: #0a0a10;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px 20px;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    h1 { 
      margin-bottom: 15px; 
      font-size: 2rem; 
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--primary), 0 0 20px var(--secondary);
    }

    /* 攝影機主容器 */
    .container {
      position: relative;
      width: 100%;
      max-width: 1200px; 
      aspect-ratio: 16/9;
      background-color: #111;
      border: 2px solid #333;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
      cursor: crosshair; 
      transition: box-shadow 0.3s ease;
    }

    .container.rolling {
      box-shadow: 0 0 50px var(--secondary);
      animation: pulseBorder 0.5s infinite alternate;
    }

    video { 
      display: none; 
    }
    
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
    }

    /* --- HUD 介面樣式設計 --- */
    #status { 
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: #00e5ff; 
      font-size: 1.1rem; 
      font-weight: bold; 
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.4); 
      padding: 10px 15px;
      border-radius: 8px;
      backdrop-filter: blur(6px); 
      border: 1px solid rgba(0, 229, 255, 0.2);
      pointer-events: none; 
    }
    
    /* 抽獎過程中的提示字 (已縮小比例，避免佔用太大空間) */
    #winner-display {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 30px #ff00ea;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 25px;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 215, 0, 0.5);
      display: none; 
      pointer-events: none;
      animation: fadeIn 0.4s ease-out;
    }

    .controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20; 
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      width: 90%;
    }

    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      backdrop-filter: blur(10px); 
      transition: all 0.3s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    button:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.8);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { background: rgba(34, 34, 34, 0.6); color: #888; border-color: transparent; cursor: not-allowed; }

    #start-btn { background: rgba(0, 180, 219, 0.4); border-color: rgba(0, 229, 255, 0.4); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);}
    #draw-btn { background: rgba(241, 39, 17, 0.4); border-color: rgba(255, 204, 0, 0.4); box-shadow: 0 0 15px rgba(245, 175, 25, 0.2);}
    #reset-btn { background: linear-gradient(135deg, #00b4db, #0083b0); border-color: #00e5ff; display: none; padding: 15px 50px; font-size: 1.3rem; box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);}
    #switch-cam-btn, #undo-btn { background: rgba(50, 50, 50, 0.5); }

    @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes pulseBorder { from { box-shadow: 0 0 20px var(--primary); } to { box-shadow: 0 0 50px var(--secondary); } }
  </style>
</head>
<body>

  <h1>✨ 班級抽獎系統 PRO ✨</h1>
  
  <div class="container" id="canvas-container">
    <video id="input_video" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>

    <div id="status">請按下下方「啟動相機」</div>
    <div id="winner-display"></div>

    <div class="controls">
      <button id="start-btn">📸 啟動相機</button>
      <button id="switch-cam-btn" style="display:none;">🔄 切換</button>
      <button id="undo-btn" style="display:none;">↩️ 撤銷</button>
      <button id="draw-btn" disabled>🎲 開始抽獎</button>
      <button id="reset-btn">🔄 繼續抽獎</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d', { willReadFrequently: true });
    const container = document.getElementById('canvas-container');
    
    const elements = {
      controls: document.querySelector('.controls'),
      startBtn: document.getElementById('start-btn'),
      switchBtn: document.getElementById('switch-cam-btn'),
      drawBtn: document.getElementById('draw-btn'),
      resetBtn: document.getElementById('reset-btn'),
      undoBtn: document.getElementById('undo-btn'),
      status: document.getElementById('status'),
      winnerDisplay: document.getElementById('winner-display')
    };

    const state = {
      detectedFaces: [],
      manualFaces: [],
      frozenFaces: [],
      isRolling: false,
      isFrozen: false,
      showWinnerView: false, 
      winnerIndex: -1,
      isCameraRunning: false,
      isDetecting: false, 
      isLooping: false,
      useFrontCamera: true, 
      snapshotImage: null,
      globalAlpha: 0, 
      globalAlphaDir: 0.05
    };

    const fx = {
      isShooting: false,
      arrowProgress: 0,
      arrowStart: {x:0, y:0},
      arrowTarget: {x:0, y:0},
      trail: [], 
      explosionFrame: 0,
      particles: [], 
      clickRipples: [],
      zoomProgress: 0,
      zoomSrc: {x:0, y:0, w:0, h:0},
      zoomDst: {x:0, y:0, w:0, h:0}
    };

    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });
    faceDetection.setOptions({ model: 'full', minDetectionConfidence: 0.4 });
    
    faceDetection.onResults((results) => {
      if (state.isFrozen) return;
      state.detectedFaces = results.detections.map(d => {
         const box = d.boundingBox;
         let w = box.width * canvasElement.width;
         let h = box.height * canvasElement.height;
         let x = box.xCenter * canvasElement.width - (w / 2);
         let y = box.yCenter * canvasElement.height - (h / 2);
         if (state.useFrontCamera) x = canvasElement.width - x - w;
         return { x, y, w, h, isManual: false };
      });
    });

    async function startCamera() {
      if (window.stream) window.stream.getTracks().forEach(t => t.stop());
      elements.status.innerText = "⏳ 正在啟動相機...";
      state.isDetecting = false; 

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: state.useFrontCamera ? "user" : "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        window.stream = stream;
        
        videoElement.onloadedmetadata = () => {
          videoElement.play();
          state.isCameraRunning = true;
          elements.startBtn.style.display = 'none';
          elements.switchBtn.style.display = 'inline-block';
          
          canvasElement.width = videoElement.videoWidth;
          canvasElement.height = videoElement.videoHeight;
          
          updateStatus();
          if (!state.isLooping) { state.isLooping = true; detectLoop(); }
        };
        videoElement.srcObject = stream;
      } catch (err) { alert("無法啟動相機，請確認權限。"); }
    }

    function detectLoop() {
      if (!state.isCameraRunning) return;

      state.globalAlpha += state.globalAlphaDir;
      if(state.globalAlpha > 0.8 || state.globalAlpha < 0.2) state.globalAlphaDir *= -1;

      if (!state.isFrozen) {
        canvasCtx.save();
        if (state.useFrontCamera) {
          canvasCtx.translate(canvasElement.width, 0);
          canvasCtx.scale(-1, 1);
        }
        canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.restore();

        trackManualFacesHybrid();
        
        if (!state.isDetecting && videoElement.readyState >= 2) {
          state.isDetecting = true;
          faceDetection.send({image: videoElement}).catch(e => {}).finally(() => { state.isDetecting = false; });
        }

        const validAiFaces = [];
        state.detectedFaces.forEach(aiFace => {
           let isCovered = state.manualFaces.some(mFace => Math.hypot((mFace.x+mFace.w/2) - (aiFace.x+aiFace.w/2), (mFace.y+mFace.h/2) - (aiFace.y+aiFace.h/2)) < mFace.w * 0.8);
           if (!isCovered) validAiFaces.push(aiFace);
        });

        const allFaces = [...validAiFaces, ...state.manualFaces];
        updateStatus(allFaces.length); 
        drawBoxes(allFaces);

        for (let i = fx.clickRipples.length - 1; i >= 0; i--) {
          let r = fx.clickRipples[i]; r.radius += 4; r.alpha -= 0.04;     
          canvasCtx.save(); canvasCtx.beginPath(); canvasCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
          canvasCtx.strokeStyle = `rgba(0, 255, 127, ${Math.max(0, r.alpha)})`; canvasCtx.lineWidth = 3; canvasCtx.stroke(); canvasCtx.restore();
          if (r.alpha <= 0) fx.clickRipples.splice(i, 1); 
        }

      } else {
        if (state.snapshotImage) canvasCtx.drawImage(state.snapshotImage, 0, 0);

        if (state.showWinnerView) {
            if (fx.zoomProgress < 1) {
                fx.zoomProgress += 0.035; 
                if (fx.zoomProgress > 1) fx.zoomProgress = 1;
            }
            const p = 1 - Math.pow(1 - fx.zoomProgress, 4); 

            canvasCtx.fillStyle = `rgba(0, 0, 0, ${0.4 * p})`;
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            const curX = fx.zoomSrc.x + (fx.zoomDst.x - fx.zoomSrc.x) * p;
            const curY = fx.zoomSrc.y + (fx.zoomDst.y - fx.zoomSrc.y) * p;
            const curW = fx.zoomSrc.w + (fx.zoomDst.w - fx.zoomSrc.w) * p;
            const curH = fx.zoomSrc.h + (fx.zoomDst.h - fx.zoomSrc.h) * p;

            canvasCtx.save();
            canvasCtx.shadowColor = `rgba(255, 215, 0, ${p})`;
            canvasCtx.shadowBlur = 40 * p;
            canvasCtx.lineWidth = 6 * p;
            canvasCtx.strokeStyle = `rgba(255, 215, 0, ${p})`;

            canvasCtx.drawImage(state.snapshotImage, fx.zoomSrc.x, fx.zoomSrc.y, fx.zoomSrc.w, fx.zoomSrc.h, curX, curY, curW, curH);
            if (p > 0.1) canvasCtx.strokeRect(curX, curY, curW, curH);
            
            // [關鍵修改]：將天選之人的文字直接黏在頭像框的正上方，隨比例縮放，絕不遮擋人臉！
            if (p > 0.3) {
                canvasCtx.shadowBlur = 10 * p;
                canvasCtx.fillStyle = `rgba(255, 215, 0, ${p})`;
                
                // 動態字體大小：縮放過程中字體微微變大，但不會變得像之前一樣巨大
                const fontSize = 16 + (14 * p); 
                canvasCtx.font = `bold ${fontSize}px sans-serif`;
                canvasCtx.textAlign = "center";
                canvasCtx.textBaseline = "bottom"; // 對齊底部，確保字從框框往上長
                
                // 畫在特寫框框的正上方 12px 處
                canvasCtx.fillText("🎉 天選之人 🎉", curX + curW / 2, curY - 12);
            }
            canvasCtx.restore();

            if (fx.particles.length > 0) updateAndDrawConfetti();

        } else {
            drawBoxes(state.frozenFaces);
            if (fx.isShooting) updateAndDrawArrow();
            if (fx.particles.length > 0) updateAndDrawConfetti();
        }
      }

      requestAnimationFrame(detectLoop);
    }

    function trackManualFacesHybrid() {
      if (!state.isCameraRunning || state.isFrozen || state.manualFaces.length === 0) return;
      const tSize = 30; const searchRadius = 60; 

      state.manualFaces.forEach(face => {
        let closestAI = null; let minAiDist = Infinity;
        let faceCenterX = face.x + face.w / 2; let faceCenterY = face.y + face.h / 2;

        state.detectedFaces.forEach(aiFace => {
          let aiCenterX = aiFace.x + aiFace.w / 2; let aiCenterY = aiFace.y + aiFace.h / 2;
          let dist = Math.hypot(faceCenterX - aiCenterX, faceCenterY - aiCenterY);
          if (dist < minAiDist) { minAiDist = dist; closestAI = aiFace; }
        });

        if (closestAI && minAiDist < face.w * 0.8) {
          face.x = closestAI.x; face.y = closestAI.y; face.w = closestAI.w; face.h = closestAI.h; face.lostCount = 0;
          let tX = Math.max(0, Math.min(canvasElement.width - tSize, face.x + face.w / 2 - tSize / 2));
          let tY = Math.max(0, Math.min(canvasElement.height - tSize, face.y + face.h / 2 - tSize / 2));
          face.lastTrackX = tX; face.lastTrackY = tY;
          face.template = canvasCtx.getImageData(tX, tY, tSize, tSize);
          return; 
        }

        let sX = Math.max(0, face.lastTrackX - searchRadius); let sY = Math.max(0, face.lastTrackY - searchRadius);
        let sW = Math.min(canvasElement.width - sX, searchRadius * 2); let sH = Math.min(canvasElement.height - sY, searchRadius * 2);
        if (sW <= tSize || sH <= tSize) { face.lostCount++; return; }

        const searchData = canvasCtx.getImageData(sX, sY, sW, sH).data;
        const templ = face.template.data;
        let minDiff = Infinity; let bestX = 0, bestY = 0;

        for (let y = 0; y <= sH - tSize; y += 3) {
          for (let x = 0; x <= sW - tSize; x += 3) {
            let diff = 0;
            for (let i = 0; i < tSize * tSize; i += 2) {
               const tIdx = i * 4 + 1; const sIdx = ((y + Math.floor(i/tSize)) * sW + (x + i%tSize)) * 4 + 1;
               diff += Math.abs(templ[tIdx] - searchData[sIdx]);
               if (diff > minDiff) break;
            }
            if (diff < minDiff) { minDiff = diff; bestX = x; bestY = y; }
          }
        }
        if (minDiff < 18000) { 
           face.x += (sX + bestX) - face.lastTrackX; face.y += (sY + bestY) - face.lastTrackY;
           face.lastTrackX = sX + bestX; face.lastTrackY = sY + bestY; face.lostCount = 0;
           face.template = canvasCtx.getImageData(face.lastTrackX, face.lastTrackY, tSize, tSize);
        } else { face.lostCount++; }
      });
    }

    canvasElement.addEventListener('click', (event) => {
      if (!state.isCameraRunning || state.isFrozen) return;
      const rect = canvasElement.getBoundingClientRect();
      let realX = (event.clientX - rect.left) * (canvasElement.width / rect.width);
      let realY = (event.clientY - rect.top) * (canvasElement.height / rect.height);
      
      fx.clickRipples.push({ x: realX, y: realY, radius: 0, alpha: 1 });
      let clickedFace = state.manualFaces.find(f => realX >= f.x && realX <= f.x + f.w && realY >= f.y && realY <= f.y + f.h);
      if (clickedFace) { elements.status.innerText = "⚠️ 該區域已經被鎖定過了！"; clickedFace.flashTimer = 15; return; }

      const w = canvasElement.width * 0.06; const h = canvasElement.height * 0.1;
      const x = Math.max(0, Math.min(canvasElement.width - w, realX - w/2));
      const y = Math.max(0, Math.min(canvasElement.height - h, realY - h/2));
      const tSize = 30; 
      const tX = Math.max(0, Math.min(canvasElement.width - tSize, x + w/2 - tSize/2));
      const tY = Math.max(0, Math.min(canvasElement.height - tSize, y + h/2 - tSize/2));
      
      state.manualFaces.push({
        x, y, w, h, template: canvasCtx.getImageData(tX, tY, tSize, tSize),
        lastTrackX: tX, lastTrackY: tY, isManual: true, lostCount: 0, flashTimer: 0 
      });
      elements.undoBtn.style.display = 'inline-block'; updateStatus();
    });

    elements.undoBtn.addEventListener('click', () => {
      state.manualFaces.pop();
      if(state.manualFaces.length === 0) elements.undoBtn.style.display = 'none';
      updateStatus();
    });

    function drawBoxes(faces) {
      if (!faces) return;
      faces.forEach((face, index) => {
        let isFlashing = face.flashTimer && face.flashTimer > 0;
        let isLost = face.lostCount > 10; 
        let baseColor = face.isManual ? 'rgba(0, 255, 127, 0.9)' : 'rgba(0, 229, 255, 0.9)';
        let color = baseColor; let lineWidth = face.isManual ? 4 : 3; let labelText = face.isManual ? "📌 手動" : "🤖 鎖定";

        if (isFlashing) { face.flashTimer--; color = '#ff0055'; lineWidth = 6; canvasCtx.shadowColor = "#ff0055"; canvasCtx.shadowBlur = 20; } 
        else if (isLost && face.isManual && !state.isFrozen) { color = `rgba(255, 165, 0, 0.9)`; labelText = "⚠️ 丟失目標"; } 
        else if (state.isRolling) {
           if (index === state.winnerIndex) { color = '#ff00ea'; lineWidth = 6; canvasCtx.shadowColor = "#ff00ea"; canvasCtx.shadowBlur = 20; } 
           else { color = 'rgba(255, 255, 255, 0.35)'; lineWidth = 2; canvasCtx.shadowBlur = 0; }
        } else if (index === state.winnerIndex && state.isFrozen && !fx.isShooting) {
           color = '#ffd700'; lineWidth = 8; canvasCtx.shadowColor = "#ffd700"; canvasCtx.shadowBlur = 30;
        } else if (!state.isFrozen) { canvasCtx.shadowColor = baseColor; canvasCtx.shadowBlur = 15 * state.globalAlpha; }

        canvasCtx.save(); canvasCtx.beginPath(); canvasCtx.roundRect(face.x, face.y, face.w, face.h, 10);
        canvasCtx.lineWidth = lineWidth; canvasCtx.strokeStyle = color;

        if (face.isManual && !state.isFrozen && !isLost) { canvasCtx.setLineDash([8, 8]); } 
        else if (isLost && !state.isFrozen) { canvasCtx.setLineDash([4, 4]); } else { canvasCtx.setLineDash([]); }
        canvasCtx.stroke();

        if (!state.isRolling && !(index === state.winnerIndex && state.isFrozen)) {
           canvasCtx.font = "bold 16px sans-serif"; canvasCtx.fillStyle = color; canvasCtx.shadowBlur = 0; 
           canvasCtx.fillText(labelText, face.x, face.y - 8);
        }
        canvasCtx.restore();
      });
    }

    elements.drawBtn.addEventListener('click', () => {
      const validAiFaces = [];
      state.detectedFaces.forEach(aiFace => {
         let isCovered = state.manualFaces.some(mFace => Math.hypot((mFace.x+mFace.w/2) - (aiFace.x+aiFace.w/2), (mFace.y+mFace.h/2) - (aiFace.y+aiFace.h/2)) < mFace.w * 0.8);
         if (!isCovered) validAiFaces.push(aiFace);
      });
      const allFaces = [...validAiFaces, ...state.manualFaces];
      if (allFaces.length === 0) return;

      state.isFrozen = true; state.frozenFaces = allFaces;
      state.snapshotImage = new Image(); state.snapshotImage.src = canvasElement.toDataURL();

      elements.drawBtn.style.display = 'none'; elements.switchBtn.style.display = 'none'; elements.undoBtn.style.display = 'none'; 
      container.classList.add('rolling'); elements.status.innerText = "🔒 鎖定目標 | 演算中...";

      state.isRolling = true;
      elements.winnerDisplay.style.display = 'block'; elements.winnerDisplay.innerText = "⚡ 正在尋找天選之人 ⚡";
      
      let rollCount = 0;
      const rollInterval = setInterval(() => {
        state.winnerIndex = Math.floor(Math.random() * state.frozenFaces.length); rollCount++;
        if (rollCount >= 35) { clearInterval(rollInterval); finishLottery(); }
      }, 70); 
    });

    function finishLottery() {
      state.isRolling = false; container.classList.remove('rolling');
      elements.winnerDisplay.innerText = "🚀 發射鎖定..."; prepareArrow(); 
    }

    function prepareArrow() {
      fx.arrowStart = { x: canvasElement.width/2, y: canvasElement.height }; 
      const target = state.frozenFaces[state.winnerIndex];
      fx.arrowTarget = { x: target.x + target.w/2, y: target.y + target.h/2 };
      fx.isShooting = true; fx.arrowProgress = 0; fx.explosionFrame = 0; fx.trail = [];
    }

    function updateAndDrawArrow() {
      if (fx.arrowProgress < 1) { fx.arrowProgress += 0.03; } else {
        fx.explosionFrame++;
        if (fx.explosionFrame > 20) { fx.isShooting = false; triggerConfetti(); showWinnerDetail(); return; }
      }
      const p = Math.min(fx.arrowProgress, 1);
      const curX = fx.arrowStart.x + (fx.arrowTarget.x - fx.arrowStart.x) * p;
      const curY = fx.arrowStart.y + (fx.arrowTarget.y - fx.arrowStart.y) * Math.pow(p, 0.8); 
      if(p < 1) { fx.trail.push({x: curX, y: curY}); if(fx.trail.length > 15) fx.trail.shift(); }

      canvasCtx.save(); canvasCtx.beginPath();
      if(fx.trail.length > 0) canvasCtx.moveTo(fx.trail[0].x, fx.trail[0].y);
      fx.trail.forEach(pt => canvasCtx.lineTo(pt.x, pt.y));
      canvasCtx.strokeStyle = "rgba(0, 229, 255, 0.6)"; canvasCtx.lineWidth = 8; canvasCtx.lineCap = "round";
      canvasCtx.shadowColor = "#00e5ff"; canvasCtx.shadowBlur = 15; canvasCtx.stroke(); canvasCtx.restore();

      if (p < 1) {
        canvasCtx.beginPath(); canvasCtx.arc(curX, curY, 10, 0, Math.PI*2);
        canvasCtx.fillStyle = "#fff"; canvasCtx.shadowColor = "#00e5ff"; canvasCtx.shadowBlur = 20; canvasCtx.fill();
      } else {
        canvasCtx.save(); canvasCtx.translate(fx.arrowTarget.x, fx.arrowTarget.y);
        const radius = fx.explosionFrame * 8; const alpha = 1 - (fx.explosionFrame / 20); 
        canvasCtx.beginPath(); canvasCtx.arc(0, 0, radius, 0, Math.PI * 2);
        canvasCtx.fillStyle = `rgba(255, 215, 0, ${alpha})`; canvasCtx.fill();
        canvasCtx.lineWidth = 4; canvasCtx.strokeStyle = `rgba(255, 255, 255, ${alpha})`; canvasCtx.stroke(); canvasCtx.restore();
      }
    }

    function triggerConfetti() {
      const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f', '#fff'];
      for(let i=0; i<150; i++) {
        fx.particles.push({
          x: canvasElement.width / 2, y: canvasElement.height / 2,
          vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40 - 10,
          size: Math.random() * 8 + 4, color: colors[Math.floor(Math.random() * colors.length)],
          angle: Math.random() * 360, spin: (Math.random() - 0.5) * 10
        });
      }
    }

    function updateAndDrawConfetti() {
      canvasCtx.save();
      for(let i = fx.particles.length - 1; i >= 0; i--) {
        let p = fx.particles[i]; p.vy += 0.8; p.x += p.vx; p.y += p.vy; p.angle += p.spin;
        canvasCtx.translate(p.x, p.y); canvasCtx.rotate(p.angle * Math.PI / 180);
        canvasCtx.fillStyle = p.color; canvasCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        canvasCtx.rotate(-p.angle * Math.PI / 180); canvasCtx.translate(-p.x, -p.y);
        if(p.y > canvasElement.height) fx.particles.splice(i, 1);
      }
      canvasCtx.restore();
    }

    function showWinnerDetail() {
      elements.winnerDisplay.style.display = 'none'; // 將原本巨大的 HTML 提示隱藏
      state.showWinnerView = true; 
      fx.zoomProgress = 0; 
      
      const face = state.frozenFaces[state.winnerIndex];
      const padding = 0.5;
      
      let extW = face.w * (1 + padding);
      let extH = face.h * (1 + padding);
      let extX = face.x - (face.w * padding) / 2;
      let extY = face.y - (face.h * padding) / 2;
      fx.zoomSrc = { x: extX, y: extY, w: extW, h: extH };

      // [微調] 將最終放大的佔比縮小一點點，避免在小螢幕上太過壓迫 (0.4 改為 0.3)
      const scale = Math.min((canvasElement.width * 0.3) / extW, (canvasElement.height * 0.35) / extH);
      let targetW = extW * scale;
      let targetH = extH * scale;
      let targetX = (canvasElement.width - targetW) / 2;
      let targetY = (canvasElement.height - targetH) / 2;
      fx.zoomDst = { x: targetX, y: targetY, w: targetW, h: targetH };
      
      elements.resetBtn.style.display = 'inline-block';
    }

    elements.resetBtn.addEventListener('click', () => {
      state.isFrozen = false; state.showWinnerView = false; state.winnerIndex = -1;
      state.frozenFaces = []; state.manualFaces = []; fx.particles = [];
      elements.winnerDisplay.style.display = 'none'; elements.winnerDisplay.innerText = "";
      elements.drawBtn.style.display = 'inline-block'; elements.switchBtn.style.display = 'inline-block';
      if(state.manualFaces.length > 0) elements.undoBtn.style.display = 'inline-block';
      elements.resetBtn.style.display = 'none'; elements.status.innerText = "✔️ 系統已重置 | 繼續偵測中...";
    });

    function updateStatus(c = state.detectedFaces.length + state.manualFaces.length) {
      if (!state.isFrozen) {
        if (c > 0) { elements.drawBtn.disabled = false; elements.status.innerText = `🟢 準備就緒 | 總鎖定人數: ${c} (手動: ${state.manualFaces.length})`; } 
        else { elements.drawBtn.disabled = true; elements.status.innerText = `🔴 等待目標... (可點擊畫面手動圈選)`; }
      }
    }

    elements.startBtn.addEventListener('click', startCamera);
    elements.switchBtn.addEventListener('click', () => { state.useFrontCamera = !state.useFrontCamera; startCamera(); });
  </script>
</body>
</html>
